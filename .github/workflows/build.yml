name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Fixed Keystore
        run: |
          mkdir -p keystore
          echo "" | base64 -d > keystore/gmscreen.keystore

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace
          cp keystore/gmscreen.keystore app/build/outputs/apk/release/gmscreen.keystore

      - name: Upload Release APK and Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMScreen-Accessible-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/gmscreen.keystore
          retention-days: 7
