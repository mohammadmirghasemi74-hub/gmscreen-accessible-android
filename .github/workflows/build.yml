name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create Keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/gmscreen.keystore -alias gmscreen -keyalg RSA -keysize 2048 -validity 10000 -storepass gmscreen123 -keypass gmscreen123 -dname "CN=GMScreen Accessible, OU=Accessibility, O=GMScreen, L=Tehran, ST=Tehran, C=IR"
          # Convert to base64 so we can preserve it permanently
          echo "=== BASE64 KEYSTORE START ==="
          base64 -w 0 keystore/gmscreen.keystore
          echo ""
          echo "=== BASE64 KEYSTORE END ==="

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMScreen-Accessible-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
